plugins { id 'com.android.application' }

android {
    namespace 'io.trigate.newapp'
    compileSdk 34
    defaultConfig {
        applicationId 'io.trigate.newapp.dev'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0-proxy-dev'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation files('libs/psiphontunnel-2.0.39.aar') }
